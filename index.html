<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON DASH: TUTORIAL EDITION</title>
    <style>
        :root { --neon-blue: #00f2ff; --neon-pink: #ff007f; --gold: #ffcc00; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; font-family: 'Arial Black', sans-serif; }
        canvas { display: block; }
        
        #hud { position: absolute; top: 15px; width: 100%; display: flex; justify-content: space-around; color: white; pointer-events: none; z-index: 20; text-shadow: 0 0 10px rgba(0,242,255,0.8); }
        .stat-box { text-align: center; }
        .label { font-size: 10px; opacity: 0.7; text-transform: uppercase; letter-spacing: 2px; }
        .val { font-size: 26px; display: block; font-weight: 900; }

        #msg, #tutorial { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, rgba(0,10,20,0.85) 0%, rgba(0,0,0,0.98) 100%); color: white; flex-direction: column; z-index: 30; text-align: center; border: 2px solid var(--neon-blue); margin: 20px; border-radius: 20px; transition: opacity 0.5s; }
        
        #tutorial { background: rgba(0, 0, 0, 0.9); display: none; z-index: 40; border-color: var(--gold); }
        .tut-step { margin: 20px; display: none; }
        .tut-step.active { display: block; }
        .gesture-icon { font-size: 60px; margin-bottom: 10px; display: block; filter: drop-shadow(0 0 10px var(--neon-blue)); }

        .btn { padding: 18px 60px; font-size: 30px; background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink)); color: #fff; border: none; border-radius: 50px; cursor: pointer; pointer-events: auto; font-weight: 900; text-transform: uppercase; box-shadow: 0 0 20px var(--neon-blue); transition: 0.2s; margin-top: 20px; }
        .btn:active { transform: scale(0.9); }
    </style>
</head>
<body>

<div id="hud">
    <div class="stat-box"> <span class="label">RECORD</span> <span id="highScoreText" class="val">0</span> </div>
    <div class="stat-box"> <span class="label">METERS</span> <span id="scoreText" class="val">0</span> </div>
    <div class="stat-box" style="color: var(--gold);"> <span class="label">COINS</span> <span id="coinText" class="val">0</span> </div>
</div>

<div id="msg">
    <h1 style="font-size: 50px; margin: 0; color: var(--neon-blue); text-shadow: 0 0 20px var(--neon-blue);">NEON DASH</h1>
    <p id="final-stats" style="margin-bottom: 20px; opacity: 0.8;">SWIPE TO RUN THROUGH THE CITY</p>
    <button class="btn" onclick="checkTutorial()">START RUN</button>
</div>

<div id="tutorial">
    <div id="step1" class="tut-step active">
        <span class="gesture-icon">↔️</span>
        <h2>MOVE LANES</h2>
        <p>Swipe LEFT or RIGHT to dodge trains.</p>
        <button class="btn" onclick="nextStep(2)">NEXT</button>
    </div>
    <div id="step2" class="tut-step">
        <span class="gesture-icon">⬆️</span>
        <h2>JUMP</h2>
        <p>Swipe UP to clear low barriers.</p>
        <button class="btn" onclick="nextStep(3)">NEXT</button>
    </div>
    <div id="step3" class="tut-step">
        <span class="gesture-icon">⬇️</span>
        <h2>SLIDE</h2>
        <p>Swipe DOWN to duck under high signs.</p>
        <button class="btn" onclick="finishTutorial()">I'M READY</button>
    </div>
</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const HORIZON = 0.42;
const LANES = [-180, 0, 180];

let game = {
    active: false, speed: 0, lane: 1,
    px: 0, py: 0, vy: 0, sliding: false, slideT: 0,
    cameraX: 0,
    score: 0, coins: 0, highScore: localStorage.getItem('metro_high_ultra') || 0,
    distSpawn: 0, frame: 0
};

let entities = [];
document.getElementById('highScoreText').innerText = game.highScore;

function project(x, y, z) {
    let s = 1000 / (1000 + z);
    return { 
        x: (canvas.width / 2) + ((x - game.cameraX) * s), 
        y: (canvas.height * HORIZON) + ((canvas.height * (1 - HORIZON) - y) * s), 
        s 
    };
}

// TUTORIAL LOGIC
function checkTutorial() {
    const hasPlayed = localStorage.getItem('neon_dash_first_timer');
    if (!hasPlayed) {
        document.getElementById('msg').style.display = 'none';
        document.getElementById('tutorial').style.display = 'flex';
    } else {
        startGame();
    }
}

function nextStep(step) {
    document.querySelectorAll('.tut-step').forEach(s => s.classList.remove('active'));
    document.getElementById('step' + step).classList.add('active');
}

function finishTutorial() {
    localStorage.setItem('neon_dash_first_timer', 'true');
    document.getElementById('tutorial').style.display = 'none';
    startGame();
}

// TOUCH ENGINE
let tsX, tsY, swiped;
window.addEventListener('touchstart', e => { tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; swiped = false; }, {passive: false});
window.addEventListener('touchmove', e => {
    if (!game.active || swiped) return;
    let dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
    if (Math.abs(dx) > 20) {
        if (dx > 20 && game.lane < 2) game.lane++;
        if (dx < -20 && game.lane > 0) game.lane--;
        swiped = true;
    } else if (Math.abs(dy) > 20) {
        if (dy < -20 && game.py === 0) game.vy = 28;
        else if (dy > 20) { 
            if (game.py > 0) game.vy = -35; 
            else { game.sliding = true; game.slideT = 40; }
        }
        swiped = true;
    }
}, {passive: false});

function startGame() {
    game.active = true; game.speed = 25; game.score = 0; game.coins = 0;
    game.lane = 1; game.px = 0; game.py = 0; game.cameraX = 0; entities = [];
    document.getElementById('msg').style.display = 'none';
}

function update() {
    if (!game.active) return;
    game.frame++;
    game.score += game.speed / 12;
    game.speed += 0.005;
    game.px += (LANES[game.lane] - game.px) * 0.15;
    game.cameraX += (game.px - game.cameraX) * 0.08;

    if (game.py > 0 || game.vy !== 0) {
        game.py += game.vy; game.vy -= 1.8;
        if (game.py <= 0) {
            game.py = 0;
            if (game.vy < -20) { game.sliding = true; game.slideT = 40; }
            game.vy = 0;
        }
    }
    if (game.slideT > 0) { game.slideT--; if (game.slideT === 0) game.sliding = false; }

    document.getElementById('scoreText').innerText = Math.floor(game.score);
    document.getElementById('coinText').innerText = game.coins;

    game.distSpawn += game.speed;
    if (game.distSpawn > 1000 + game.speed * 8) {
        game.distSpawn = 0;
        let r = Math.random();
        let type = r < 0.3 ? 'train' : (r < 0.5 ? 'high' : (r < 0.7 ? 'low' : 'coin'));
        entities.push({ x: LANES[Math.floor(Math.random() * 3)], z: 9000, type, color: Math.random() > 0.5 ? '#ff007f' : '#00f2ff' });
    }

    for (let i = entities.length - 1; i >= 0; i--) {
        let en = entities[i];
        en.z -= game.speed;
        if (en.z > 100 && en.z < 450 && Math.abs(game.px - en.x) < 85) {
            if (en.type === 'coin') { entities.splice(i, 1); game.coins++; }
            else {
                let hit = false;
                if (en.type === 'high' && game.py < 110) hit = true;
                if (en.type === 'low' && (game.py > 35 || !game.sliding)) hit = true;
                if (en.type === 'train' && game.py < 180) hit = true;
                if (hit) {
                    game.active = false;
                    if (game.score > game.highScore) { game.highScore = Math.floor(game.score); localStorage.setItem('metro_high_ultra', game.highScore); }
                    document.getElementById('highScoreText').innerText = game.highScore;
                    document.getElementById('msg').style.display = 'flex';
                }
            }
        }
        if (en.z < -200) entities.splice(i, 1);
    }
}

function draw() {
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    
    let sky = ctx.createLinearGradient(0, 0, 0, canvas.height * HORIZON);
    sky.addColorStop(0, '#000814'); sky.addColorStop(1, '#001d3d');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let side = -1; side <= 1; side += 2) {
        if (side === 0) continue;
        for (let z = 0; z < 10000; z += 2000) {
            let modZ = (z - (game.score * 15) % 10000);
            if (modZ < 0) modZ += 10000;
            let p1 = project(side * 700, 0, modZ), p2 = project(side * 2000, 4000, modZ);
            ctx.fillStyle = '#000814';
            ctx.fillRect(p1.x, p2.y, p2.x - p1.x, p1.y - p2.y);
            ctx.fillStyle = side > 0 ? '#ff007f' : '#00f2ff';
            ctx.globalAlpha = 0.3;
            ctx.fillRect(p1.x, p2.y, 5 * p1.s, p1.y - p2.y);
            ctx.globalAlpha = 1.0;
        }
    }

    ctx.fillStyle = '#000';
    ctx.beginPath();
    let t1 = project(-600, 0, 0), t2 = project(600, 0, 0), t3 = project(300, 0, 10000), t4 = project(-300, 0, 10000);
    ctx.moveTo(t1.x, t1.y); ctx.lineTo(t2.x, t2.y); ctx.lineTo(t3.x, t3.y); ctx.lineTo(t4.x, t4.y);
    ctx.fill();

    LANES.forEach(lx => {
        ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
        let r1 = project(lx - 50, 0, 0), r2 = project(lx - 50, 0, 10000);
        ctx.beginPath(); ctx.moveTo(r1.x, r1.y); ctx.lineTo(r2.x, r2.y); ctx.stroke();
    });

    let fog = ctx.createLinearGradient(0, canvas.height * HORIZON - 20, 0, canvas.height * HORIZON + 300);
    fog.addColorStop(0, '#003566'); fog.addColorStop(1, 'transparent');
    ctx.fillStyle = fog; ctx.fillRect(0, canvas.height * HORIZON - 50, canvas.width, 400);

    entities.sort((a,b) => b.z - a.z).forEach(en => {
        let p = project(en.x, 0, en.z), s = p.s;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath(); ctx.ellipse(p.x, p.y, 80 * s, 20 * s, 0, 0, 7); ctx.fill();

        if (en.type === 'coin') {
            ctx.fillStyle = '#ffc300'; ctx.shadowBlur = 15; ctx.shadowColor = '#ffc300';
            ctx.beginPath(); ctx.arc(p.x, p.y - 60*s, 35*s, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
        } else if (en.type === 'train') {
            ctx.fillStyle = '#001d3d'; ctx.fillRect(p.x-95*s, p.y-250*s, 190*s, 250*s);
            ctx.strokeStyle = en.color; ctx.lineWidth = 3 * s; ctx.strokeRect(p.x-95*s, p.y-250*s, 190*s, 250*s);
            ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.8;
            ctx.fillRect(p.x-80*s, p.y-230*s, 160*s, 80*s); ctx.globalAlpha = 1.0;
        } else if (en.type === 'high') {
            ctx.fillStyle = '#ff007f'; ctx.fillRect(p.x-110*s, p.y-120*s, 220*s, 120*s);
            ctx.fillStyle = '#fff'; ctx.fillRect(p.x-110*s, p.y-80*s, 220*s, 20*s);
        } else if (en.type === 'low') {
            ctx.fillStyle = '#00f2ff'; ctx.fillRect(p.x-140*s, p.y-380*s, 280*s, 130*s);
            ctx.fillStyle = '#fff'; ctx.fillRect(p.x-5*s, p.y-380*s, 10*s, 500);
        }
    });

    let pp = project(game.px, game.py, 400), ps = pp.s;
    let bob = Math.sin(game.frame * 0.3) * (game.py === 0 ? 5 : 0) * ps;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath(); ctx.ellipse(pp.x, project(game.px, 0, 400).y, 50 * ps, 15 * ps, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff';
    let h = (game.sliding ? 45 : 130) * ps;
    ctx.shadowBlur = 10; ctx.shadowColor = '#fff';
    ctx.fillRect(pp.x - 40 * ps, pp.y - h + bob, 80 * ps, h);
    ctx.shadowBlur = 0;
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
